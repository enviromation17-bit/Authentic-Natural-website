<!DOCTYPE html>
<html>
<head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Authentic Naturals Workspace</title>
<style>
:root{--ink:#1e2925;--muted:#72817b;--bg:#f6f8f5;--panel:#fff;--rail:#ecf1eb;--green:#2e715a;--line:#e5eae4;--shadow:0 20px 70px rgba(20,47,35,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #92c9ab;outline-offset:2px}.layout{min-height:100vh;display:flex}.content{padding:32px 40px 50px;flex:1;min-width:0;max-width:calc(100vw - 100px)}.sidebar{position:fixed;right:0;top:0;bottom:0;width:88px;background:var(--rail);display:flex;align-items:center;flex-direction:column;padding:20px 10px;border-left:1px solid #dce5db;z-index:5}.brand{height:42px;width:42px;border-radius:14px;background:#204d3e;color:#fff;font-size:20px;display:grid;place-items:center;font-weight:700}.nav{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:20px;width:100%}.nav button{position:relative;display:flex;align-items:center;justify-content:center;border-radius:14px;width:48px;height:48px;background:transparent;color:#53675c}.nav button.active{background:#203c32;color:#fff;box-shadow:0 8px 18px #1b4d3530}.nav button:not(.active):hover{background:#dce7dc}.navlabel{display:none}.svgicon{display:inline-flex}.svgicon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}.new{margin-top:12px;background:#203c32;color:#fff;border-radius:14px;width:48px;height:48px;font-size:22px}.rail-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}.avatar{width:36px;height:36px;border-radius:50%;background:#c5d4a8;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1f3328}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}.header-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.header-title h1{margin:0;font-size:clamp(1.8rem,3vw,2.4rem)}.select-page{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff}.sub{color:var(--muted);margin:8px 0 0;max-width:42ch}.topbuttons{display:flex;gap:8px;flex-wrap:wrap}.subbutton,.actionbutton{border-radius:999px;padding:10px 16px;font-size:13px;font-weight:600}.subbutton{background:#fff;border:1px solid var(--line);color:var(--ink)}.actionbutton{background:#203c32;color:#fff}.loader,.empty,.locked{padding:24px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sectionrow{display:flex;justify-content:space-between;align-items:end;margin:8px 0 12px}.sectionrow h2{margin:0;font-size:18px}.muted{color:var(--muted);font-size:12px}.stage{display:grid;grid-template-columns:90px 1fr 28px;gap:10px;align-items:center;margin:8px 0}.stage .bar{height:8px;background:#e8eee6;border-radius:99px;overflow:hidden}.stage .bar span{display:block;height:100%;background:#2e715a}.listrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.listrow:last-child{border-bottom:0}.dot{width:32px;height:32px;border-radius:50%;background:#e8f0e4;display:grid;place-items:center;font-weight:700;font-size:12px;color:#253c29}.rowtext{flex:1;min-width:0}.rowtext strong{display:block;font-size:14px}.rowtext small{color:var(--muted);font-size:12px}.pill{font-size:11px;padding:4px 10px;border-radius:999px;background:#eef3ea;color:#253c29;font-weight:600}.quick{position:fixed;right:110px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:6}.quick button{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-size:18px}.quick .primary{background:#203c32;color:#fff;border-color:#203c32}.modalback{position:fixed;inset:0;background:rgba(20,35,28,.45);display:none;place-items:center;z-index:20;padding:16px}.modalback.show{display:grid}.modal{background:#fff;border-radius:20px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:600}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.closebtn{background:#f0f3ee;border-radius:999px;padding:8px 14px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#203c32;color:#fff;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}.toast.show{opacity:1}.focus-block{background:linear-gradient(135deg,#f3f7f0,#e8f0e4);border:1px solid rgba(37,60,41,.08);border-radius:20px;padding:22px 22px 18px;margin-bottom:22px}.focus-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#68784d;margin-bottom:12px}.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}.action-card{text-align:left;border:1px solid rgba(37,60,41,.1);background:#fff;border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}.action-card:hover{box-shadow:0 10px 24px rgba(37,60,41,.1)}.action-card strong{font-size:15px;color:#1f3328}.action-card span{font-size:13px;color:#647064}.action-card em{font-style:normal;font-size:12px;font-weight:600;color:#253c29}.action-card.urgent{border-color:rgba(180,80,40,.25);background:#fffaf6}.action-card.warn{border-color:rgba(160,120,30,.25);background:#fffcf5}.quick-row{display:flex;flex-wrap:wrap;gap:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.metric{border:1px solid rgba(37,60,41,.08);background:#fff;border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}.metric.clickable{cursor:pointer}.metric.clickable:hover{box-shadow:0 8px 20px rgba(37,60,41,.08)}.metric .mlabel{font-size:12px;color:#68784d;font-weight:600}.metric .mvalue{font-size:28px;font-weight:700;color:#1f3328;line-height:1.1}.metric .mhint{font-size:12px;color:#8a9588}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.panel-head h2{font-size:16px;margin:0}.textlink{background:none;border:none;color:#253c29;font-size:12px;font-weight:600;cursor:pointer;padding:0}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.content{padding:20px 16px 80px;max-width:100%}.sidebar{width:72px}.quick{right:84px}}@media(max-width:560px){.metrics{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
</style>
<style>
.stock-line{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.stock-line:last-child{border-bottom:0}.stock-main{flex:2;min-width:170px}.stock-main strong,.stock-amount strong{display:block;font-size:15px}.stock-main small,.stock-amount small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.stock-amount{min-width:120px}.stock-amount strong{font-size:25px;color:#23543e}.stock-line .pill{white-space:nowrap}
@media(max-width:560px){.stock-line{align-items:flex-start}.stock-line .actionbutton{width:100%}}
</style>
<style>
.lead-manage-row{display:flex;align-items:flex-start;gap:18px;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
.lead-manage-row:last-child{border-bottom:0}.lead-main{min-width:0;flex:1}.lead-main strong{display:block;font-size:15px}.lead-main small{display:block;font-size:12px;color:var(--muted);margin-top:4px}.lead-main p{margin:9px 0 0;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.lead-controls{display:flex;align-items:end;gap:8px}.lead-controls label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:600}.lead-controls select{min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.delete-lead{padding:10px 13px;border:1px solid #f1c4bf;border-radius:10px;background:#fff5f4;color:#9a3028;font-weight:600}
.delete-lead:hover{background:#fee9e6}
@media(max-width:700px){.lead-manage-row{flex-direction:column}.lead-controls{width:100%;justify-content:space-between}}
</style></head>
<body>
<div class="layout"><main class="content"><div class="topline"><div><div class="eyebrow">AUTHENTIC NATURALS / WORKSPACE</div><div class="header-title"><h1 id="pageTitle">Home</h1><select class="select-page" id="pageSelect" aria-label="Choose page"></select></div><p class="sub" id="pageSub">What needs your attention today.</p></div><div class="topbuttons"><button class="subbutton" onclick="refresh()">↻ Refresh</button><button class="subbutton" onclick="openSheet()">Open Sheet ↗</button></div></div><div id="app"><div class="loader">Loading your data…</div></div><div class="locked" id="error"></div></main>
<div class="quick"><button class="primary" title="Add enquiry" onclick="openForm('lead')">＋</button><button title="New order" onclick="openForm('order')">▣</button><button title="Log message note" onclick="openForm('message')">✉</button></div>
<aside class="sidebar"><div class="brand" title="Authentic Naturals">A</div><button class="new" onclick="openForm('lead')" title="Add enquiry">＋</button><nav class="nav" id="nav"></nav><div class="rail-bottom"><div class="avatar" title="Your Google account">AN</div><button class="subbutton" style="font-size:11px;padding:9px" onclick="window.open('https://myaccount.google.com/','_blank')" title="Google account">Account</button></div></aside></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeForm()"><div class="modal"><div style="display:flex;align-items:start;justify-content:space-between"><h2 id="modalTitle">New enquiry</h2><button class="closebtn" onclick="closeForm()">✕</button></div><div class="muted" id="modalHint"></div><form id="entryForm" onsubmit="submitForm(event)"><div class="fields" id="formFields"></div><div class="modal-actions"><button type="button" class="closebtn" onclick="closeForm()">Cancel</button><button type="submit" class="actionbutton" id="saveBtn">Save</button></div></form></div></div><div class="toast" id="toast" role="status"></div>
<script>
const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',leads:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/>',orders:'<path d="M4 4h16l-1 17H5L4 4Z"/>',inventory:'<path d="m3 7 9-4 9 4-9 4-9-4Z"/>',whatsapp:'<path d="M20 11a8 8 0 0 1-8 8 9 9 0 0 1-4-.9L3 20l1.8-5A8 8 0 1 1 20 11Z"/>',settings:'<circle cx="12" cy="12" r="3"/>'};
const pages=[['overview','Home','What needs your attention today.'],['leads','Enquiries','Customers who contacted you.'],['orders','Orders','Confirmed and pending orders.'],['inventory','Stock','How much product you have left.'],['whatsapp','Messages','Notes from WhatsApp chats (manual).'],['settings','Settings','Sheet link and your account.']];
const icon=(k)=>'<span class="svgicon"><svg viewBox="0 0 24 24">'+(icons[k]||'')+'</svg></span>';
let page='overview',data=null,formMode=null,filter='';
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function drawNav(){const nav=document.getElementById('nav');nav.innerHTML='';pages.forEach(([id,label])=>{const b=document.createElement('button');b.className=page===id?'active':'';b.title=label;b.setAttribute('aria-label',label);b.innerHTML=icon(id)+'<span class="navlabel">'+label+'</span>';b.onclick=()=>navigate(id);nav.appendChild(b)});const sel=document.getElementById('pageSelect');sel.innerHTML=pages.map(([id,label])=>'<option value="'+id+'">'+label+'</option>').join('');sel.value=page;sel.onchange=e=>navigate(e.target.value)}
function navigate(p){page=p;filter='';const x=pages.find(x=>x[0]===page);document.getElementById('pageTitle').textContent=x[1];document.getElementById('pageSub').textContent=x[2];drawNav();render()}
async function run(fn,...args){return new Promise((resolve,reject)=>{
  if(!google||!google.script||!google.script.run){
    reject(new Error('Open this dashboard from the Apps Script web app link, not as a raw HTML file.'));
    return;
  }
  const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
  if(typeof runner[fn]!=='function'){
    reject(new Error('Server function missing: '+fn+'. Update Code.gs and redeploy.'));
    return;
  }
  runner[fn].apply(runner,args);
})}
async function refresh(){document.getElementById('app').innerHTML='<div class="loader">Loading your data…</div>';try{data=await run('dashboardData');document.getElementById('error').textContent='';render()}catch(e){document.getElementById('error').textContent=e.message||String(e);document.getElementById('app').innerHTML=''}}
function render(){if(!data)return;document.getElementById('app').innerHTML=page==='overview'?overview():page==='settings'?settings():page==='inventory'?stockPage():page==='leads'?leadsPage():tablePage()}
const metric=(label,v,foot,clickable,go)=>'<button type="button" class="metric'+(clickable?' clickable':'')+'" '+(clickable?"onclick=\"navigate('"+go+"')\"":'')+'><span class="mlabel">'+label+'</span><span class="mvalue">'+escapeHtml(String(v))+'</span><span class="mhint">'+foot+'</span></button>';
function overview(){const s=data.stats||{};const leads=data.leads||[];const newLeads=Number(s.newLeads||0);const pending=Number(s.pending||0);const totalOrders=Number(s.orders||0);const lowStock=Number(s.lowStock||0);const actions=[];if(newLeads>0)actions.push({t:'Reply to new enquiries',d:newLeads+' waiting for a response',go:'leads',c:'urgent'});if(pending>0)actions.push({t:'Review pending orders',d:pending+' need your decision',go:'orders',c:'warn'});if(lowStock>0)actions.push({t:'Check low stock',d:lowStock+' product(s) below 5 units',go:'inventory',c:'warn'});if(!actions.length)actions.push({t:'All clear for now',d:'No urgent enquiries, orders, or stock alerts.',go:'leads',c:'ok'});const actionHtml=actions.map(a=>'<button type="button" class="action-card '+a.c+'" onclick="navigate(\''+a.go+'\')"><strong>'+a.t+'</strong><span>'+a.d+'</span><em>Open →</em></button>').join('');const stageNames=['New','Contacted','Qualified','Won','Lost'];const stage=(names,index,rows)=>names.map(x=>{let n=rows.filter(r=>r[index]===x).length;let percent=rows.length?Math.round(n/rows.length*100):0;return '<div class="stage"><label>'+x+'</label><div class="bar"><span style="width:'+percent+'%"></span></div><b>'+n+'</b></div>'}).join('');const recent=[...leads].slice(-5).reverse().map(r=>'<div class="listrow"><div class="dot">'+escapeHtml((r[2]||'?').slice(0,1).toUpperCase())+'</div><div class="rowtext"><strong>'+escapeHtml(r[2]||'Customer')+'</strong><small>'+escapeHtml((r[8]||'No message').slice(0,80))+'</small></div><span class="pill">'+escapeHtml(r[9]||'New')+'</span></div>').join('')||'<div class="empty">No enquiries yet. Tap <b>+</b> to add one, or wait for website leads.</div>';return '<div class="focus-block"><div class="focus-label">Start here</div><div class="action-grid">'+actionHtml+'</div><div class="quick-row"><button type="button" class="actionbutton" onclick="openForm(\'lead\')">＋ Add enquiry</button><button type="button" class="subbutton" onclick="openForm(\'order\')">＋ Add order</button><button type="button" class="subbutton" onclick="openForm(\'message\')">＋ Message note</button></div></div><div class="metrics">'+metric('New enquiries',newLeads,'Tap to open',true,'leads')+metric('Pending orders',pending,'Need review',true,'orders')+metric('All orders',totalOrders,'Recorded so far',true,'orders')+metric('Low stock',lowStock,'Below 5 units',true,'inventory')+'</div><div class="sectionrow"><h2>At a glance</h2><span class="muted">From your Google Sheet</span></div><div class="cols"><div class="panel"><div class="panel-head"><h2>Enquiry stages</h2><button type="button" class="textlink" onclick="navigate(\'leads\')">View all</button></div>'+stage(stageNames,9,leads)+'</div><div class="panel"><div class="panel-head"><h2>Latest enquiries</h2><button type="button" class="textlink" onclick="navigate(\'leads\')">View all</button></div>'+recent+'</div></div>'}
const defs={leads:{headers:['Customer','Phone','Source','Message','Stage'],cols:[2,3,5,8,9]},orders:{headers:['Order','Customer','SKU','Qty','Total PKR','Status','Payment'],cols:[0,3,5,6,8,9,10]},inventory:{headers:['SKU','Product','Price PKR','On hand','Reserved','Available','Verified'],cols:[0,1,2,3,4,5,6]},whatsapp:{headers:['Customer','Phone','Direction','Message','Status'],cols:[2,3,4,5,6]}};

// Inventory is managed only from this dashboard. No website stock code is changed.
function stockPage(){
 const items=data.inventory||[];
 const n=x=>Number(String(x||0).replace(/,/g,''))||0;
 let rows=items.map(r=>{
   const available=n(r[3])-n(r[4]);
   const label=r[6]!=='Yes'?'Not verified':available===0?'Out of stock':available<5?'Low stock':'Available';
   return '<div class="stock-line"><div class="stock-main"><strong>'+escapeHtml(r[1]||'Unnamed product')+'</strong><small>'+escapeHtml(r[0])+' · PKR '+escapeHtml(r[2])+'</small></div>'+
   '<div class="stock-amount"><strong>'+Math.max(0,available)+'</strong><small>available · '+escapeHtml(r[3])+' on hand</small></div>'+
   '<span class="pill">'+escapeHtml(label)+'</span>'+
   '<button class="actionbutton" data-sku="'+escapeHtml(r[0])+'" onclick="stockAction(this.dataset.sku)">Manage stock</button></div>';
 }).join('');
 return '<section class="focus-block"><div class="focus-label">Inventory control</div><h2 style="margin:0 0 8px">Stock made simple</h2><p class="sub" style="margin:0 0 16px">Add products, receive deliveries or correct counts. Changes are saved in Google Sheets and recorded in Stock History. This does not update website availability.</p>'+
 '<div class="quick-row"><button class="actionbutton" onclick="openForm(\'product\')">＋ Add product</button><button class="subbutton" onclick="navigate(\'orders\')">View orders</button></div></section>'+
 '<div class="panel"><div class="panel-head"><h2>Products ('+items.length+')</h2><span class="muted">Available = On hand − Reserved</span></div>'+
 (rows||'<div class="empty">No products yet. Select Add product to start.</div>')+'</div>';
}
function stockAction(sku){
 formMode='adjust';
 const item=(data.inventory||[]).find(r=>r[0]===sku);
 if(!item){notify('Product not found');return}
 const quantity=Number(String(item[3]||0).replace(/,/g,''))||0;
 document.getElementById('modalTitle').textContent='Manage stock · '+item[1];
 document.getElementById('modalHint').textContent='Current stock: '+quantity+' · Reserved: '+item[4]+'. Changes are saved privately with an audit note.';
 document.getElementById('formFields').innerHTML='<div class="field full"><label>What do you want to do?</label><select id="f_action"><option value="Receive">Add received stock</option><option value="Remove">Remove damaged / returned stock</option><option value="Set">Correct physical stock count</option></select></div>'+
 '<div class="field"><label>Quantity</label><input id="f_quantity" required type="number" min="0" step="1" value="1"></div>'+
 '<div class="field full"><label>Reason for change</label><input id="f_reason" required maxlength="240" placeholder="e.g. New delivery received"></div>';
 document.getElementById('modalback').dataset.sku=sku;
 document.getElementById('modalback').classList.add('show');
}

const LEAD_STAGES=['New','Contacted','Qualified','Won','Lost'];
function leadsPage(){
  const leads=data.leads||[];
  const cards=leads.slice().reverse().map(lead=>{
    const id=String(lead[0]||'');
    const stage=String(lead[9]||'New');
    const choices=LEAD_STAGES.map(s=>'<option value="'+s+'"'+(stage===s?' selected':'')+'>'+s+'</option>').join('');
    return '<article class="lead-manage-row">'+
      '<div class="lead-main"><strong>'+escapeHtml(lead[2]||'Customer')+'</strong><small>'+escapeHtml(lead[3]||'No phone')+' · '+escapeHtml(lead[5]||'Enquiry')+'</small><p>'+escapeHtml(lead[8]||'No message')+'</p></div>'+
      '<div class="lead-controls"><label>Status <select aria-label="Lead status for '+escapeHtml(lead[2]||'customer')+'" data-id="'+escapeHtml(id)+'" onchange="setLeadStatus(this)">'+choices+'</select></label>'+
      '<button type="button" class="delete-lead" data-id="'+escapeHtml(id)+'" onclick="confirmDeleteLead(this.dataset.id)">Delete</button></div>'+
    '</article>';
  }).join('');
  return '<section class="focus-block"><div class="focus-label">Customer enquiries</div><h2 style="margin:0 0 8px">Manage leads</h2><p class="sub" style="margin:0 0 16px">Update a lead’s stage from the dropdown. Deleted leads are moved to a private Deleted Leads tab for recovery.</p>'+
  '<button type="button" class="actionbutton" onclick="openForm(&quot;lead&quot;)">＋ Add enquiry</button></section>'+
  '<div class="panel"><div class="panel-head"><h2>Leads ('+leads.length+')</h2><span class="muted">Changes saved to Google Sheets</span></div>'+
  (cards||'<div class="empty">No leads yet. Click Add enquiry to start.</div>')+'</div>';
}
async function setLeadStatus(select){
  const id=select.dataset.id;
  select.disabled=true;
  try{
    await run('updateStatus','Leads',id,'status',select.value);
    notify('Lead status updated');
    await refresh();
  }catch(err){
    notify('Unable to update status: '+(err.message||err));
    await refresh();
  }
}
async function confirmDeleteLead(id){
  const lead=(data.leads||[]).find(row=>String(row[0])===String(id));
  if(!lead){notify('Lead not found');return}
  const name=String(lead[2]||'Customer');
  if(!window.confirm('Delete lead for '+name+'? It will be removed from the active list and archived in Deleted Leads.'))return;
  try{
    await run('deleteLead',id);
    notify('Lead removed from active list');
    await refresh();
  }catch(err){
    notify('Unable to delete lead: '+(err.message||err));
    await refresh();
  }
}
function tablePage(){const key=page;const conf=defs[key];if(!conf)return '<div class="empty">Nothing here.</div>';const rows=(data[key]||[]);if(!rows.length)return '<div class="panel empty">No records yet. Use ＋ to add one.</div>';let head='<tr>'+conf.headers.map(h=>'<th>'+h+'</th>').join('')+'</tr>';let body=rows.map(r=>'<tr>'+conf.cols.map(i=>'<td>'+escapeHtml(r[i])+'</td>').join('')+'</tr>').join('');return '<div class="panel" style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'}
function settings(){return '<div class="panel"><h2>Account and workspace</h2><p class="muted" style="margin:12px 0">Stock, orders and enquiries are managed here, with records stored privately in your Google Sheet.</p><button class="actionbutton" onclick="openSheet()">Open Google Sheet ↗</button></div>'}
function openSheet(){if(data&&data.sheetUrl)window.open(data.sheetUrl,'_blank','noopener')}
async function changeStatus(tab,id,field,value){try{await run('updateStatus',tab[0].toUpperCase()+tab.slice(1),id,field,value);notify('Updated');await refresh()}catch(e){notify('Failed: '+(e.message||e));await refresh()}}
const F={lead:[['name','Customer name','text',true],['phone','Phone','tel',false],['city','City','text',false],['sku','Product SKU','text',false],['quantity','Quantity','number',false],['message','Enquiry message','textarea',true],['consent','Customer consent obtained','checkbox',false]],order:[['name','Customer name','text',true],['phone','Phone','tel',true],['city','City','text',false],['sku','Product SKU','text',true],['quantity','Quantity','number',true],['unitPrice','Unit price PKR','number',true],['leadId','Related Lead ID','text',false],['notes','Notes','textarea',false]],message:[['name','Customer name','text',false],['phone','Phone','tel',true],['direction','Direction','select',false],['message','Message or conversation note','textarea',true],['leadId','Related Lead ID','text',false]],product:[['sku','SKU (unique code)','text',true],['product','Product name','text',true],['price','Price in PKR','number',true],['stock','Starting stock count','number',true]]};
function openForm(mode,sku){formMode=mode;document.getElementById('modalTitle').textContent=mode==='product'?'Add a product':mode==='lead'?'New enquiry':mode==='order'?'New order':'Log message note';document.getElementById('modalHint').textContent=mode==='message'?'Manual note only — nothing is sent on WhatsApp.':mode==='product'?'Start with an accurate count; new products are marked unverified until the next stock update.':'Saved into your Google Sheet.';document.getElementById('formFields').innerHTML=F[mode].map(([id,label,type,required])=>{let control=type==='textarea'?'<textarea id="f_'+id+'" '+(required?'required':'')+'></textarea>':type==='select'?'<select id="f_'+id+'">'+(id==='direction'?['Inbound','Outbound']:['No','Yes']).map(v=>'<option>'+v+'</option>').join('')+'</select>':type==='checkbox'?'<input id="f_'+id+'" type="checkbox" style="width:auto">':'<input id="f_'+id+'" type="'+type+'" '+(type==='number'?'min="0" step="1"':'')+' '+(required?'required':'')+' />';return '<div class="field '+(['message','notes','consent'].includes(id)?'full':'')+'"><label for="f_'+id+'">'+label+'</label>'+control+'</div>'}).join('');document.getElementById('modalback').classList.add('show')}
function closeForm(){document.getElementById('modalback').classList.remove('show');formMode=null}
async function submitForm(e){e.preventDefault();const mode=formMode;const get=id=>{const el=document.getElementById('f_'+id);if(!el)return'';if(el.type==='checkbox')return el.checked;return el.value};try{
  if(mode==='lead'){
    await run('writeLead',{name:get('name'),phone:get('phone'),city:get('city'),sku:get('sku'),quantity:get('quantity')||1,message:get('message'),consent:!!get('consent'),notes:''});
  }else if(mode==='order'){
    await run('createOrder',{name:get('name'),phone:get('phone'),city:get('city'),sku:get('sku'),quantity:get('quantity')||1,unitPrice:get('unitPrice')||0,leadId:get('leadId'),notes:get('notes')});
  }else if(mode==='product'){
    await run('addStockProduct',{sku:get('sku'),product:get('product'),price:get('price'),stock:get('stock')});
  }else if(mode==='adjust'){
    await run('changeStock',{sku:document.getElementById('modalback').dataset.sku,action:get('action'),quantity:get('quantity'),reason:get('reason')});
  }else if(mode==='message'){
    await run('addMessage',{name:get('name'),phone:get('phone'),direction:get('direction')||'Inbound',message:get('message'),leadId:get('leadId')});
  }
  notify('Saved');closeForm();await refresh();
}catch(err){notify('Could not save: '+(err.message||err))}}
drawNav();refresh();
</script></body></html>
