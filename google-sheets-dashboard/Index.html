<head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
:root{--ink:#1e2925;--muted:#72817b;--bg:#f6f8f5;--panel:#fff;--rail:#ecf1eb;--green:#2e715a;--line:#e5eae4;--shadow:0 20px 70px rgba(20,47,35,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #92c9ab;outline-offset:2px}button{border:0}.layout{min-height:100vh;display:flex}.content{padding:43px 57px 60px;flex:1;min-width:0;max-width:calc(100vw - 170px)}.sidebar{position:fixed;right:0;top:0;bottom:0;width:106px;background:var(--rail);display:flex;align-items:center;flex-direction:column;padding:25px 13px 20px;border-left:1px solid #dce5db;z-index:5}.brand{height:44px;width:44px;border-radius:15px;background:#204d3e;color:white;font-size:22px;display:grid;place-items:center;font-weight:700}.nav{display:flex;flex-direction:column;gap:12px;align-items:flex-end;margin-top:24px;width:100%}.nav button{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:15px;min-width:52px;width:52px;height:52px;background:transparent;color:#53675c;transition:width .45s cubic-bezier(.18,1.48,.4,1),background .2s,color .2s;white-space:nowrap;overflow:visible}.nav button.active{background:#203c32;color:#fff;width:142px;justify-content:flex-start;padding-left:17px;box-shadow:0 8px 18px #1b4d3530}.nav button .navlabel{font-weight:650;font-size:13px;max-width:0;opacity:0;overflow:hidden;transition:max-width .28s ease,opacity .2s}.nav button.active .navlabel{opacity:1;max-width:85px}.nav button:not(.active):hover{background:#dce7dc}.nav button .tooltip{position:absolute;right:62px;top:50%;transform:translate(4px,-50%);pointer-events:none;color:white;background:#283d32;border-radius:8px;padding:8px 11px;font-size:12px;opacity:0;white-space:nowrap;transition:opacity .15s,transform .2s}.nav button:hover .tooltip{opacity:1;transform:translate(0,-50%)}.nav button.active .tooltip{display:none}.svgicon{width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.svgicon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.divider{height:1px;width:43px;background:#cfdbcf;margin:8px 0}.new{margin:20px 0 3px;background:#203c32;color:white;border-radius:13px;padding:13px 12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;width:78px}.rail-bottom{margin-top:auto;display:grid;justify-items:center;gap:12px}.avatar{width:44px;height:44px;border-radius:50%;background:#d9e8dd;display:grid;place-items:center;font-weight:700;color:#285b46}.quick{position:fixed;right:112px;top:245px;display:grid;gap:12px;z-index:4}.quick button{width:43px;height:43px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);color:var(--green);font-size:20px;display:grid;place-items:center}.quick button.primary{background:var(--green);color:#fff}.quick button:hover{transform:translateY(-2px)}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:2.2px;color:var(--green)}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center}.header-title{display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-weight:720;font-size:clamp(34px,4.8vw,65px);letter-spacing:-2.7px;margin:11px 0 4px;line-height:1.07}h2{font-size:20px;letter-spacing:-.6px;margin:0}.select-page{border:1px solid var(--line);background:white;padding:10px 13px;border-radius:11px;font-size:13px;color:#52635a}.sub{color:var(--muted);font-size:14px;margin:10px 0 0}.topbuttons{display:flex;gap:10px;align-items:center}.subbutton{padding:11px 15px;background:#fff;border:1px solid var(--line);border-radius:11px;color:var(--ink);font-weight:650}.hero{margin-top:32px;background:linear-gradient(118deg,#e5efe6,#f6f8ef 78%);border:1px solid #dce8dc;border-radius:24px;padding:29px 31px;display:flex;gap:30px;align-items:center;justify-content:space-between}.hero .big{font-size:24px;font-weight:680;letter-spacing:-.8px;margin-bottom:8px}.hero p{color:#62726a;margin:0;max-width:650px;line-height:1.55}.leaf-art{height:90px;width:90px;border-radius:50%;background:#bcd5c4;display:grid;place-items:center;font-size:42px;flex-shrink:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:25px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.metric{padding:21px 23px;min-width:0}.metric .tag{font-size:12px;color:#697870;font-weight:600}.metric .value{font-size:34px;margin:10px 0 5px;font-weight:730;letter-spacing:-1.5px}.metric .foot{color:#7e8b84;font-size:11px}.metrics .metric:first-child{border-top:3px solid #326c53}.sectionrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:32px 0 15px}.muted{font-size:12px;color:var(--muted)}.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:18px}.panel{padding:21px}.stage{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f3f0}.stage:last-child{border:0}.stage label{width:100px;color:#53635b;font-size:13px}.bar{height:9px;border-radius:20px;background:#edf1ed;flex:1;overflow:hidden}.bar span{display:block;height:100%;background:#5b9875;border-radius:20px;min-width:2px;transition:width .35s}.stage b{font-size:13px;width:26px;text-align:right}.listrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f0f3f0}.listrow:last-child{border:0}.dot{height:37px;width:37px;border-radius:11px;background:#e5eee8;display:grid;place-items:center;font-size:12px;font-weight:800;color:#47715a}.rowtext{flex:1;min-width:0}.rowtext strong{display:block;font-size:13px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}.rowtext small{font-size:11px;color:var(--muted);display:block;margin-top:3px}.pill{display:inline-block;padding:5px 9px;border-radius:100px;font-size:11px;background:#ebf2ed;color:#46705a;font-weight:650}.pill.warn{background:#fff1df;color:#986b32}.toolbar{margin:29px 0 15px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.search{width:min(350px,100%);background:#fff;border:1px solid var(--line);padding:13px 16px;border-radius:12px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;background:#f7f9f6;font-size:11px;letter-spacing:.5px;color:#6a7b70;text-transform:uppercase;font-weight:750;padding:17px 19px}td{padding:16px 19px;font-size:13px;border-top:1px solid #edf1ed;max-width:300px;overflow:hidden;text-overflow:ellipsis}tbody tr:hover{background:#fbfcfb}td select{background:#f5f8f5;border:1px solid #dce7dd;border-radius:9px;padding:7px;color:#425a49}.empty{padding:46px 18px;text-align:center;color:#7c8a7f}.actionbutton{background:#2e715a;color:#fff;padding:12px 17px;border-radius:11px;font-weight:650}.notice{padding:15px;border:1px solid #dce8df;border-radius:12px;background:#f2f8f3;color:#577364;font-size:12px;margin-top:15px}.modalback{position:fixed;inset:0;background:#162b2090;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modalback.open{display:flex}.modal{background:#fff;border-radius:22px;width:min(540px,100%);padding:27px;box-shadow:0 25px 90px #0c271730;max-height:90vh;overflow:auto}.modal h2{margin-bottom:8px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1 / -1}.field label{font-size:12px;font-weight:700;color:#596d5f}.field input,.field select,.field textarea{border:1px solid #dce5dc;border-radius:10px;padding:11px 12px;background:#fbfcfa;width:100%;color:#253e30}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:10px}.closebtn{background:#eef2ed;padding:11px 15px;border-radius:9px}.toast{position:fixed;bottom:25px;left:25px;padding:13px 18px;background:#233c30;color:white;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:22;max-width:390px;font-size:13px}.toast.show{display:block}.loader{font-size:13px;color:var(--muted);margin:25px 0}.locked{background:#fff4f1;color:#a04b41;padding:15px;border-radius:12px;display:none;margin-top:15px}@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:30px 24px;max-width:calc(100vw - 142px)}.quick{right:104px}.cols{grid-template-columns:1fr}}@media(max-width:660px){.sidebar{width:70px;padding:18px 7px}.sidebar .new{font-size:0;width:49px}.sidebar .new:before{content:'+';font-size:24px}.nav button{width:47px;min-width:47px;height:47px}.nav button.active{width:47px;padding:0;justify-content:center}.nav button.active .navlabel{display:none}.quick{right:75px;top:auto;bottom:22px;display:flex}.quick button{width:39px;height:39px}.content{padding:24px 14px;max-width:calc(100vw - 69px)}h1{letter-spacing:-1.5px}.hero{padding:20px}.leaf-art{display:none}.metrics{gap:9px}.metric{padding:15px}.metric .value{font-size:27px}.fields{grid-template-columns:1fr}.topbuttons{display:none}}
</style></head>
<body>
<div class="layout"><main class="content"><div class="topline"><div><div class="eyebrow">AUTHENTIC NATURALS / WORKSPACE</div><div class="header-title"><h1 id="pageTitle">Overview</h1><select class="select-page" id="pageSelect" aria-label="Choose page"></select></div><p class="sub" id="pageSub">A clearer view of your customers and daily operations.</p></div><div class="topbuttons"><button class="subbutton" onclick="refresh()">↻ Refresh</button><button class="subbutton" onclick="window.open('https://docs.google.com/spreadsheets/d/1NGmC_vWeyayQwDxhIk2nYoSoff4U9ZuEewPDv-8r-Xg/edit','_blank')">Open Sheet ↗</button></div></div><div id="app"><div class="loader">Loading CRM data securely...</div></div><div class="locked" id="error"></div></main>
<div class="quick"><button class="primary" title="New lead" onclick="openForm('lead')">＋</button><button title="New order" onclick="openForm('order')">▣</button><button title="Log WhatsApp message" onclick="openForm('message')">✉</button></div>
<aside class="sidebar"><div class="brand" title="Authentic Naturals">A</div><button class="new" onclick="openForm('lead')">＋ New</button><nav class="nav" id="nav"></nav><div class="rail-bottom"><div class="avatar" title="Your Google account">AN</div><button class="subbutton" style="font-size:11px;padding:9px" onclick="window.open('https://myaccount.google.com/','_blank')" title="Manage your Google account">Account</button></div></aside></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeForm()"><div class="modal"><div style="display:flex;align-items:start;justify-content:space-between"><h2 id="modalTitle">New lead</h2><button class="closebtn" onclick="closeForm()">✕</button></div><div class="muted" id="modalHint"></div><form id="entryForm" onsubmit="submitForm(event)"><div class="fields" id="formFields"></div><div class="modal-actions"><button type="button" class="closebtn" onclick="closeForm()">Cancel</button><button type="submit" class="actionbutton" id="saveBtn">Save record</button></div></form></div></div><div class="toast" id="toast" role="status"></div>
<script>
const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',leads:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/><path d="M17 9h4m-2-2v4"/>',orders:'<path d="M4 4h16l-1 17H5L4 4Z"/><path d="M9 9h6M9 13h6"/>',inventory:'<path d="m3 7 9-4 9 4-9 4-9-4Zm0 0v10l9 4 9-4V7M12 11v10"/>',whatsapp:'<path d="M20 11a8 8 0 0 1-8 8 9 9 0 0 1-4-.9L3 20l1.8-5A8 8 0 1 1 20 11Z"/><path d="M9 9c1 3 3 5 6 6"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>'};
const pages=[['overview','Overview','A clearer view of your customers and daily operations.'],['leads','Leads','Every customer enquiry in one place.'],['orders','Orders','Track requests, payments, and fulfilment.'],['inventory','Inventory','Know what is available before promising stock.'],['whatsapp','WhatsApp','Manual conversation history — API not connected.'],['settings','Settings','Your workspace and access details.']];
const icon=(k)=>'<span class="svgicon"><svg viewBox="0 0 24 24">'+icons[k]+'</svg></span>';
let page='overview',data=null,formMode=null,filter='';
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4200)}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function run(name,...args){return new Promise((resolve,reject)=>{if(!(window.google&&google.script&&google.script.run)){reject(new Error('Deploy inside Google Apps Script'));return}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args)})}
function drawNav(){const nav=document.getElementById('nav');nav.innerHTML='';pages.forEach(([id,label],i)=>{if(i===4){const div=document.createElement('div');div.className='divider';nav.appendChild(div)}const b=document.createElement('button');b.className=page===id?'active':'';b.title=label;b.setAttribute('aria-label',label);b.innerHTML=icon(id)+'<span class="navlabel">'+label+'</span><span class="tooltip">'+label+'</span>';b.onclick=()=>navigate(id);nav.appendChild(b)});const sel=document.getElementById('pageSelect');sel.innerHTML=pages.map(([id,label])=>'<option value="'+id+'">'+label+'</option>').join('');sel.value=page;sel.onchange=e=>navigate(e.target.value)}
function navigate(p){page=p;filter='';const x=pages.find(x=>x[0]===page);document.getElementById('pageTitle').textContent=x[1];document.getElementById('pageSub').textContent=x[2];drawNav();render()}
function refresh(){document.getElementById('error').style.display='none';run('dashboardData').then(d=>{data=d;render()}).catch(e=>{document.getElementById('error').style.display='block';document.getElementById('error').textContent=e.message||String(e);notify('Unable to load CRM data')})}
const metric=(label,v,foot)=>'<div class="metric"><div class="tag">'+label+'</div><div class="value">'+escapeHtml(v)+'</div><div class="foot">'+foot+'</div></div>';
function overview(){const s=data.stats;const leads=data.leads,orders=data.orders;const stage=(names,index,rows)=>names.map(x=>{let n=rows.filter(r=>r[index]===x).length,percent=rows.length?Math.round(n/rows.length*100):0;return '<div class="stage"><label>'+x+'</label><div class="bar"><span style="width:'+percent+'%"></span></div><b>'+n+'</b></div>'}).join('');const recent=[...leads].slice(-5).reverse().map(r=>'<div class="listrow"><div class="dot">'+escapeHtml((r[2]||'L').slice(0,1).toUpperCase())+'</div><div class="rowtext"><strong>'+escapeHtml(r[2])+'</strong><small>'+escapeHtml(r[8]||'No message')+'</small></div><span class="pill">'+escapeHtml(r[9])+'</span></div>').join('')||'<div class="empty">No leads yet. Use ＋ New to add one.</div>';return '<div class="hero"><div><div class="big">Your business, organized.</div><p>Manage enquiries, orders, and stock from one calm workspace. Data is stored in your private Google Sheet and updated when you refresh.</p></div><div class="leaf-art">✳</div></div><div class="metrics">'+metric('New enquiries',s.newLeads,'Awaiting your response')+metric('Pending orders',s.pending,'Require your review')+metric('Total orders',s.orders,'Recorded orders')+metric('Low stock',s.lowStock,'Verified products below 5')+'</div><div class="sectionrow"><h2>Operational pulse</h2><span class="muted">Based on Sheet records</span></div><div class="cols"><div class="panel"><h2 style="font-size:16px;margin-bottom:12px">Lead pipeline</h2>'+stage(['New','Contacted','Qualified','Won','Lost'],9,leads)+'</div><div class="panel"><h2 style="font-size:16px;margin-bottom:12px">Recent enquiries</h2>'+recent+'</div></div>'}
const defs={leads:{headers:['Customer','Phone','Source','Message','Stage'],cols:[2,3,5,8,9]},orders:{headers:['Order','Customer','SKU','Qty','Total PKR','Status','Payment'],cols:[0,3,5,6,8,9,10]},inventory:{headers:['SKU','Product','Price PKR','On hand','Reserved','Available','Verified'],cols:[0,1,2,3,4,5,6]},whatsapp:{headers:['Customer','Phone','Direction','Message','Status'],cols:[2,3,4,5,6]}};
function tablePage(){const info=defs[page];if(!info)return '';const rows=data[page]||[];const filtered=rows.filter(r=>r.some(v=>String(v).toLowerCase().includes(filter.toLowerCase())));const action=page==='inventory'?'Update stock':page==='whatsapp'?'Log message':page==='orders'?'New order':'New lead';const onClick=page==='inventory'?'notify(\'Select a product row to edit stock\')':`openForm('${page==='leads'?'lead':page==='orders'?'order':'message'}')`;const rowHtml=filtered.map(r=>'<tr>'+info.cols.map((col)=>{if((page==='leads'&&col===9)||(page==='orders'&&(col===9||col===10))||(page==='whatsapp'&&col===6)){const options=page==='leads'?['New','Contacted','Qualified','Won','Lost']:page==='orders'&&col===9?['Pending','Confirmed','Cancelled','Fulfilled']:page==='orders'?['Unpaid','Paid','Refunded']:['New','Replied','Closed'];return '<td><select aria-label="Update status" onchange="changeStatus(\''+page+'\',\''+escapeHtml(r[0])+'\',\''+(col===10?'payment':'status')+'\',this.value)">'+options.map(x=>'<option '+(r[col]===x?'selected':'')+'>'+x+'</option>').join('')+'</select></td>'}return '<td title="'+escapeHtml(r[col])+'">'+escapeHtml(r[col])+'</td>'}).join('')+(page==='inventory'?'<td><button class="subbutton" onclick="openForm(\'stock\',\''+escapeHtml(r[0])+'\')">Edit stock</button></td>':'')+'</tr>').join('');return '<div class="toolbar"><input class="search" placeholder="Search '+page+'..." id="search" value="'+escapeHtml(filter)+'" oninput="filter=this.value;const pos=this.selectionStart;render();const el=document.getElementById(\'search\');el.focus();el.setSelectionRange(pos,pos)" /><button class="actionbutton" onclick="'+onClick+'">＋ '+action+'</button></div><div class="tablewrap"><table><thead><tr>'+info.headers.map(h=>'<th>'+h+'</th>').join('')+(page==='inventory'?'<th>Actions</th>':'')+'</tr></thead><tbody>'+ (rowHtml||'<tr><td colspan="9" class="empty">No matching records. Add one to get started.</td></tr>')+'</tbody></table></div>'+(page==='whatsapp'?'<div class="notice">This page stores manual notes only. It does not send or receive WhatsApp messages. Connect Meta later.</div>':'')}
function settings(){return '<div class="hero"><div><div class="big">Signed in with Google</div><p>Your Google login is managed by Google. When you return with the same signed-in account, you normally won\'t need to log in again. Access is checked on every server request.</p></div></div><div class="sectionrow"><h2>Account and workspace</h2></div><div class="panel"><div class="listrow"><div class="rowtext"><strong>Approved Google account</strong><small>'+escapeHtml(data.email)+'</small></div></div><div class="listrow"><div class="rowtext"><strong>Source of truth</strong><small>Authentic Naturals CRM — Google Sheets</small></div><button class="subbutton" onclick="window.open(\'https://docs.google.com/spreadsheets/d/1NGmC_vWeyayQwDxhIk2nYoSoff4U9ZuEewPDv-8r-Xg/edit\',\'_blank\')">Open</button></div><div class="listrow"><div class="rowtext"><strong>Sign-in and logout</strong><small>Use Google account controls to sign out or switch accounts.</small></div><button class="subbutton" onclick="window.open(\'https://accounts.google.com/Logout\',\'_blank\')">Google sign-out ↗</button></div></div><div class="notice">This dashboard requires a separate deployment executed as the accessing user, and an ADMIN_EMAILS allowlist. It does not replace the existing lead-capture Web App.</div>'}
function render(){if(!data)return;document.getElementById('app').innerHTML=page==='overview'?overview():page==='settings'?settings():tablePage()}
async function changeStatus(tab,id,field,value){try{await run('updateStatus',tab[0].toUpperCase()+tab.slice(1),id,field,value);notify('Updated');await refresh()}catch(e){notify('Failed: '+(e.message||e));await refresh()}}
const F={lead:[['name','Customer name','text',true],['phone','Phone','tel',false],['city','City','text',false],['sku','Product SKU','text',false],['quantity','Quantity','number',false],['message','Enquiry message','textarea',true],['consent','Customer consent obtained','checkbox',false]],order:[['name','Customer name','text',true],['phone','Phone','tel',true],['city','City','text',false],['sku','Product SKU','text',true],['quantity','Quantity','number',true],['unitPrice','Unit price PKR','number',true],['leadId','Related Lead ID','text',false],['notes','Notes','textarea',false]],message:[['name','Customer name','text',false],['phone','Phone','tel',true],['direction','Direction','select',false],['message','Message or conversation note','textarea',true],['leadId','Related Lead ID','text',false]],stock:[['stock','Stock on hand','number',true],['reserved','Reserved','number',true],['verified','Availability verified','select',true]]};
function openForm(mode,sku){formMode=mode;let product=sku&&(data?.inventory||[]).find(r=>r[0]===sku);document.getElementById('modalTitle').textContent=mode==='stock'?'Stock — '+sku:mode==='lead'?'New enquiry':mode==='order'?'New order':'Log WhatsApp conversation';document.getElementById('modalHint').textContent=mode==='message'?'Manual record only — no message is sent.':mode==='stock'?'Set physical and reserved quantities accurately.':'The record will be saved to your Google Sheet.';document.getElementById('formFields').innerHTML=F[mode].map(([id,label,type,required])=>{let control=type==='textarea'?'<textarea id="f_'+id+'" '+(required?'required':'')+'></textarea>':type==='select'?'<select id="f_'+id+'">'+(id==='direction'?['Inbound','Outbound']:['No','Yes']).map(v=>'<option>'+v+'</option>').join('')+'</select>':type==='checkbox'?'<input id="f_'+id+'" type="checkbox" style="width:auto">':'<input id="f_'+id+'" type="'+type+'" '+(type==='number'?'min="0" step="1"':'')+' '+(required?'required':'')+' />';return '<div class="field '+(['message','notes','consent'].includes(id)?'full':'')+'"><label for="f_'+id+'">'+label+'</label>'+control+'</div>'}).join('');if(mode==='stock'&&product){document.getElementById('f_stock').value=product[3];document.getElementById('f_reserved').value=product[4];document.getElementById('f_verified').value=product[6];document.getElementById('entryForm').dataset.sku=sku}if(mode==='order')document.getElementById('f_quantity').value=1;if(mode==='lead')document.getElementById('f_quantity').value=1;document.getElementById('modalback').classList.add('open')}
function closeForm(){document.getElementById('modalback').classList.remove('open');document.getElementById('entryForm').reset();delete document.getElementById('entryForm').dataset.sku}
async function submitForm(e){e.preventDefault();const mode=formMode;const input={};F[mode].forEach(([id,_,type])=>{const el=document.getElementById('f_'+id);input[id]=type==='checkbox'?el.checked:el.value});const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='Saving...';try{if(mode==='stock')await run('updateStock',document.getElementById('entryForm').dataset.sku,input.stock,input.reserved,input.verified);else if(mode==='lead')await run('writeLead',input);else if(mode==='order')await run('createOrder',input);else await run('addMessage',input);notify('Saved successfully');closeForm();await refresh()}catch(err){notify('Save failed: '+(err.message||err))}finally{btn.disabled=false;btn.textContent='Save record'}}
drawNav();refresh();
</script></body></html>
